{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container h-100 d-flex justify-content-center align-items-center">

    <form method="post" class="form-control w-50">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">Register</button>
    </form>

</div>

{% endblock %}
