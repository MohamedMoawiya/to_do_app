{% extends 'base.html' %}

{% block content %}

<nav class="navbar bg-white border-bottom shadow-sm">
    <div class="container py-2">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold mb-0" href="#">
            <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-primary text-white p-2">
                <i class="fa-solid fa-check" aria-hidden="true"></i>
            </span>
            ToDo
        </a>
        <a href="{% url 'index' %}" class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light text-secondary p-2"
           aria-label="User profile">
            <i class="fa-solid fa-circle-user fa-lg" aria-hidden="true"></i>
        </a>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <section class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-3 p-md-4 p-lg-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <p class="text-uppercase text-primary small fw-semibold mb-2">Task dashboard</p>
                    <h1 class="h3 mb-1">{{ request.user }}</h1>
                    <p class="text-secondary mb-0">Keep your day organized, one task at a time.</p>
                </div>
                <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-2 px-3 rounded-3"
                        data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Add Task
                </button>
            </div>

            <div class="table-responsive border rounded-3">
                <table class="table table-hover table-striped align-middle text-center mb-0">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th scope="col" class="py-3 small text-uppercase">Done</th>
                            <th scope="col" colspan="2" class="py-3 text-start small text-uppercase">Task</th>
                            <th scope="col" class="py-3 small text-uppercase">Created</th>
                            <th scope="col" class="py-3 small text-uppercase">Status</th>
                            <th scope="col" class="py-3 small text-uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-list">
                        {% for task in tasks %}
                            {% include 'tasks/task.html' %}
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>


<!-- Add Task Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header border-0 pb-0">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Add Task</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-3">
        <form hx-post="{% url 'add_task' %}" hx-target="#tasks-list" hx-swap="beforeend" method="post" id="addTaskForm">
            {% csrf_token %}
            <label for="new-task-title" class="form-label fw-semibold">Task title</label>
            <input id="new-task-title" type="text" name="title" maxlength="50" class="form-control mb-1 task-title-input" aria-describedby="add-title-error" required>
            <div id="add-title-error" class="title-validation small text-danger d-none" aria-live="polite"></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-sm btn-outline-secondary px-3">Reset</button>
                <button type="submit" class="btn btn-sm btn-primary px-3">Add task</button>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>





{% endblock %}
